version: 2

models:
  - name: dim_date
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: users_dim
    description: Type 1 user dimension with hashed email.
    config:
      group: commerce
    columns:
      - name: user_id
        tests: [not_null, unique]

  - name: products_dim
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: distribution_centers_dim
    columns:
      - name: distribution_center_id
        tests: [not_null, unique]

  - name: order_items
    description: Entity-grained table (1 row per order_item) with product attrs and costs.
    config:
      group: commerce
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: item_revenue
        tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 0}

  - name: orders
    description: Entity-grained table (1 row per order) aggregated from items.
    config:
      group: commerce
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: order_gross_revenue
        tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 0}

  - name: events
    description: Entity-grained events (behavioral) at event_id grain.
    config:
      group: commerce
    columns:
      - name: event_id
        tests: [not_null, unique]

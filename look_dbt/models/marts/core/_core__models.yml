version: 2

models:
  - name: order_items
    description: "Core fact at line-item grain with product/DC enrichment."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_look__orders')
                field: order_id
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__users')
                field: user_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__products')
                field: product_id
      - name: distribution_center_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__distribution_centers')
                field: distribution_center_id
      - name: sale_price
        description: "Nullable, but if present must be >= 0."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: orders
    description: "Core order grain with item aggregates."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_look__users')
                field: user_id
      - name: created_at
        tests: [not_null]
      - name: item_count
        description: "Derived from items; must be >= 0."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: order_gross_revenue
        description: "Sum of item sale_price; must be >= 0."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

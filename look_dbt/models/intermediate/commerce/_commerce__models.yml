version: 2

models:
  # -----------------------
  # Conformed ORDERS
  # -----------------------
  - name: int_commerce_orders
    description: "Conformed orders (union of sources) with survivorship (newest wins)."
    columns:
      - name: order_id
        description: "Business key for an order."
        tests: [not_null, unique]
      - name: user_id
        description: "FK to users."
        tests:
          - not_null
          - relationships:
              to: ref('int_commerce_users')
              field: user_id
      - name: order_status
        description: "Normalized order status."
        tests:
          - accepted_values:
              values: ['Cancelled','Shipped','Complete','Returned','Processing']
      - name: order_date
        description: "DATE(created_at)."
        tests: [not_null]
      - name: created_at
        tests: [not_null]
      - name: canonical_updated_at
        description: "Watermark used for incremental fan-in."
        tests: [not_null]

  # -----------------------
  # Conformed ORDER ITEMS
  # -----------------------
  - name: int_commerce_order_items
    description: "Conformed order items (union of sources) with survivorship."
    columns:
      - name: order_item_id
        description: "Business key for a line item."
        tests: [not_null, unique]
      - name: order_id
        description: "FK to orders."
        tests:
          - not_null
          - relationships:
              to: ref('int_commerce_orders')
              field: order_id
      - name: user_id
        description: "FK to users (nullable if absent upstream)."
        tests:
          - relationships:
              to: ref('int_commerce_users')
              field: user_id
              where: "user_id is not null"
      - name: product_id
        description: "FK to products."
        tests:
          - not_null
          - relationships:
              to: ref('int_commerce_products')
              field: product_id
      - name: inventory_item_id
        description: "FK to inventory_items (nullable)."
        tests:
          - relationships:
              to: ref('int_commerce_inventory_items')
              field: inventory_item_id
              where: "inventory_item_id is not null"
              severity: warn
      - name: item_status
        description: "Normalized line status."
        tests:
          - accepted_values:
              values: ['Cancelled','Returned','Complete','Shipped','Processing', null]
      - name: item_date
        description: "DATE(COALESCE(delivered_at, created_at))."
        tests: [not_null]
      - name: sale_price
        description: "Non-negative sales price."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: canonical_updated_at
        tests: [not_null]

  # -----------------------
  # Conformed EVENTS (time-partitioned)
  # -----------------------
  - name: int_commerce_events
    description: "Conformed web/app events (insert_overwrite by event_date)."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: user_id
        description: "FK to users (nullable for anonymous)."
        tests:
          - relationships:
              to: ref('int_commerce_users')
              field: user_id
              where: "user_id is not null"
      - name: event_ts
        tests: [not_null]
      - name: event_date
        tests: [not_null]
      - name: event_type
        description: "Normalized event type."
        tests:
          - accepted_values:
              values: ['cancel','purchase','product','cart','department','home']
      - name: traffic_source
        description: "Normalized marketing source."
        tests:
          - accepted_values:
              values: ['Adwords','Organic','Email','Facebook','YouTube']
      - name: browser
        description: "Normalized browser family."
        tests:
          - accepted_values:
              values: ['Firefox','Other','IE','Safari','Chrome']
      - name: canonical_updated_at
        tests: [not_null]

  # -----------------------
  # Conformed INVENTORY ITEMS
  # -----------------------
  - name: int_commerce_inventory_items
    description: "Conformed inventory units (one row per inventory_item_id)."
    columns:
      - name: inventory_item_id
        tests: [not_null, unique]
      - name: product_id
        description: "FK to products."
        tests:
          - not_null
          - relationships:
              to: ref('int_commerce_products')
              field: product_id
      - name: distribution_center_id
        description: "FK to distribution_centers (nullable)."
        tests:
          - relationships:
              to: ref('int_commerce_distribution_centers')
              field: distribution_center_id
              where: "distribution_center_id is not null"
      - name: created_at
        tests: [not_null]
      - name: created_date
        tests: [not_null]
      - name: unit_cost
        description: "Non-negative unit cost."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: retail_price
        description: "Non-negative retail price."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: canonical_updated_at
        tests: [not_null]

  # -----------------------
  # Conformed USERS
  # -----------------------
  - name: int_commerce_users
    description: "Conformed users (one row per user)."
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: email
        description: "Email may be null or duplicate in sample data; no test by design."
      - name: gender
        description: "Normalized to m/f (nullable)."
        tests:
          - accepted_values:
              values: ['M','F']
      - name: traffic_source
        description: "Normalized marketing source."
        tests:
          - accepted_values:
              values: ['Display','Organic','Search','Email','Facebook']
      - name: created_at
        tests: [not_null]
      - name: user_created_date
        tests: [not_null]
      - name: canonical_updated_at
        tests: [not_null]

  # -----------------------
  # Conformed PRODUCTS
  # -----------------------
  - name: int_commerce_products
    description: "Conformed products (one row per product)."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: distribution_center_id
        description: "FK to distribution_centers (nullable)."
        tests:
          - relationships:
              to: ref('int_commerce_distribution_centers')
              field: distribution_center_id
              where: "distribution_center_id is not null"
      - name: unit_cost
        description: "Non-negative unit cost."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: retail_price
        description: "Non-negative retail price."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: canonical_updated_at
        tests: [not_null]

  # -----------------------
  # Conformed DISTRIBUTION CENTERS
  # -----------------------
  - name: int_commerce_distribution_centers
    description: "Conformed distribution centers."
    columns:
      - name: distribution_center_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]
      - name: canonical_updated_at
        tests: [not_null]

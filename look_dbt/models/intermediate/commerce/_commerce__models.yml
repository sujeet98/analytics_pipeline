version: 2

models:
  - name: int_order_items_enriched
    description: "Order items enriched with product & DC attributes."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__orders')
                field: order_id
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('users_dim')
                field: user_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('products_dim')
                field: product_id
      - name: distribution_center_id
        tests:
          - relationships:
              arguments:
                to: ref('distribution_centers_dim')
                field: distribution_center_id

  - name: int_orders_aggregated_from_items
    description: "Order-level rollups calculated from order items."
    config:
      materialized: view

version: 2

models:
  - name: int_order_items_enriched
    description: "Order items enriched with product/DC attributes. Row grain = order_item_id."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__orders')
                field: order_id
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__users')
                field: user_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__products')
                field: product_id
      - name: distribution_center_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__distribution_centers')
                field: distribution_center_id
      - name: sale_price
        description: "Nullable; when present it must be >= 0."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: int_orders_aggregated_from_items
    description: "One row per order with items aggregation."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        description: "Canonical user_id from orders staging."
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__users')
                field: user_id
      - name: item_count
        description: "Must be non-negative."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: items_gross_revenue
        description: "Sum of sale_price; non-negative."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

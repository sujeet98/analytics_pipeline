version: 2

models:

  - name: stg_look__orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__users')
              field: user_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['created','processing','shipped','delivered','returned','cancelled','complete','unknown']
      - name: created_at
        tests: [not_null]

  - name: stg_look__order_items
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__orders')
              field: order_id
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__users')
              field: user_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__products')
              field: product_id
      - name: inventory_item_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__inventory_items')
              field: inventory_item_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['created','processing','shipped','delivered','returned','cancelled','complete','unknown']
      - name: sale_price
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strict_min: false

  - name: stg_look__events
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          # user_id can be NULL in your sample; keep relationships test but allow nulls
          - relationships:
              to: ref('stg_look__users')
              field: user_id
              # no not_null to avoid false positives
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['pageview','click','purchase','cancel','add_to_cart','remove_from_cart','checkout','login','signup','unknown']
      - name: created_at
        tests: [not_null]

  - name: stg_look__inventory_items
    columns:
      - name: inventory_item_id
        tests: [not_null, unique]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__products')
              field: product_id
      - name: product_distribution_center_id
        tests:
          - relationships:
              to: ref('stg_look__distribution_centers')
              field: distribution_center_id

  - name: stg_look__products
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: distribution_center_id
        tests:
          - relationships:
              to: ref('stg_look__distribution_centers')
              field: distribution_center_id

  - name: stg_look__users
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: email
        tests:
          - not_null

version: 2

models:
  - name: stg_look__orders
    description: "Staging view of orders: renamed, typed, de-nullified, no joins."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Created','Processing','Shipped','Delivered','Returned','Cancelled','Complete']
      - name: created_at
        tests: [not_null]

  - name: stg_look__order_items
    description: "Staging view of order line items: clean ids, monetary types, timestamps."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__orders')
              field: order_id
      - name: sale_price
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false

  - name: stg_look__events
    description: "Staging view of web/app events, typed and trimmed."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: created_at
        tests: [not_null]
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['pageview','click','purchase','cancel','add_to_cart','remove_from_cart','checkout','login','signup','unknown']

  - name: stg_look__products
    description: "Staging view of products (clean naming/types)."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: sku
        tests: [not_null]

  - name: stg_look__inventory_items
    description: "Staging view of inventory items (costs, dates, product linkage)."
    columns:
      - name: inventory_item_id
        tests: [not_null, unique]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_look__products')
              field: product_id

  - name: stg_look__distribution_centers
    description: "Staging view of distribution centers; geo kept as strings."
    columns:
      - name: distribution_center_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: stg_look__users
    description: "Staging view of users (PII in raw form; later we can mask)."
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: email
      - name: created_at

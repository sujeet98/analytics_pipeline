version: 2

# Folder-level model docs & tests. We keep these centralized per directory
# to stay DRY and make it easy to find model metadata.

models:
  - name: stg_look__orders
    description: >
      Clean, typed, deduplicated orders (no joins).
      Grain: 1 row per order_id (latest by ingest_ts_utc).
    columns:
      - name: order_id
        description: Primary key for the order
        data_type: bigint
        tests: [not_null, unique]
      - name: user_id
        description: Foreign key to users_dim.user_id
        data_type: bigint
        tests:
          - relationships: {to: ref('stg_look__users'), field: user_id}
      - name: status
        data_type: string
      - name: gender
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: created_date
        data_type: date
      - name: delivered_at
        data_type: timestamp

  - name: stg_look__order_items
    description: Clean order_items with normalized statuses, money, and dates. Grain: 1 row per order_item_id.
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships: {to: ref('stg_look__orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('stg_look__products'), field: product_id}
      - name: item_revenue
        description: Rounded to 2 decimals

  - name: stg_look__products
    description: Products with normalized attributes and retail price
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: stg_look__inventory_items
    description: Inventory items with DC id and unit cost
    columns:
      - name: inventory_item_id
        tests: [not_null, unique]

  - name: stg_look__distribution_centers
    description: Distribution center locations
    columns:
      - name: distribution_center_id
        tests: [not_null, unique]

  - name: stg_look__users
    description: Users with hashed email for PII-safe joins
    columns:
      - name: user_id
        data_type: bigint
        tests: [not_null, unique]
      - name: email_sha256
        data_type: string
        tests: [not_null]
      - name: created_date
        data_type: date

  - name: stg_look__events
    description: Website/app events, normalized. Grain: 1 row per event_id.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_date
        data_type: date

version: 2

models:
  - name: stg_look__orders
    description: "Orders, deduped by order_id (latest ingestion), typed & normalized."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Complete','Shipped','Returned','Cancelled','Processing','Unknown']
      - name: created_at
        tests: [not_null]

  - name: stg_look__order_items
    description: "Order items, deduped by order_item_id, typed & normalized."
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_look__orders')
                field: order_id
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_look__users')
                field: user_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_look__products')
                field: product_id
      - name: inventory_item_id
        tests:
          # keep as warn if you truly have early-arriving items
          - relationships:
              arguments:
                to: ref('stg_look__inventory_items')
                field: inventory_item_id
              severity: warn
              # Optional: enforce only for finalized items to reduce noise
              where: "status in ('Complete','Shipped','Returned','Cancelled')"
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Complete','Shipped','Returned','Cancelled','Processing','Unknown']
      - name: sale_price
        description: "Nullable until the item is priced; if present it must be non-negative."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: stg_look__events
    description: "Events, deduped by event_id, typed & normalized."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: user_id
        description: "Nullable FK — some events are anonymous."
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__users')
                field: user_id
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['product','cart','home','cancel','purchase','department','unknown']
      - name: created_at
        tests: [not_null]

  - name: stg_look__users
    description: "Users, deduped by user_id, typed."
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null]

  - name: stg_look__products
    description: "Products, deduped by product_id, typed."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: distribution_center_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__distribution_centers')
                field: distribution_center_id

  - name: stg_look__inventory_items
    description: "Inventory items, deduped by inventory_item_id, typed including landed product attrs."
    columns:
      - name: inventory_item_id
        tests: [not_null, unique]
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_look__products')
                field: product_id
      - name: product_distribution_center_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_look__distribution_centers')
                field: distribution_center_id

  - name: stg_look__distribution_centers
    description: "Distribution centers, deduped by distribution_center_id, typed."
    columns:
      - name: distribution_center_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

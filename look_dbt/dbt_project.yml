name: 'look_dbt'
version: '1.1.0'
config-version: 2

profile: 'look_dbt'

model-paths: ['models']
macro-paths: ['macros']
seed-paths: ['seeds']
analysis-paths: ['analyses']
snapshot-paths: ['snapshots']
test-paths: ['tests']

quoting:
  database: false
  schema: false
  identifier: false

flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  use_materialization_v2: true

vars:
  catalog_name: 'sujeet_data_analytics_workspace'
  bronze_schema: 'bronze_dev'
  silver_schema: 'silver_dev'
  gold_schema: 'gold_dev'

models:
  # Global guards
  +on_schema_change: append_new_columns
  +persist_docs: { relation: true, columns: true }

  look_dbt:

    # === STAGING (Silver) ===
    # Staging does dedupes → persist with incremental MERGE by default.
    staging:
      +schema: '{{ var("silver_schema", "silver_dev") }}'
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: sync_all_columns

    # === INTERMEDIATE ===
    # Heavy joins and reused models → persist as TABLE by default.
    intermediate:
      +schema: '{{ var("silver_schema", "silver_dev") }}'
      +materialized: table

    # === MARTS (Gold) ===
    # Tables by default; facts remain incremental in their model files (MERGE).
    marts:
      +schema: '{{ var("gold_schema", "gold_dev") }}'
      +materialized: table

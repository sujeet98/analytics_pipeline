name: 'look_dbt'
version: '1.1.0'
config-version: 2

profile: 'look_dbt'

model-paths: ['models']
macro-paths: ['macros']
seed-paths: ['seeds']
analysis-paths: ['analyses']
snapshot-paths: ['snapshots']
test-paths: ['tests']

quoting:
  database: false
  schema: false
  identifier: false

# ⬇️ TOP-LEVEL vars (same indentation as `models:`)
vars:
  catalog_name: 'sujeet_data_analytics_workspace'
  bronze_schema: 'bronze_dev'
  silver_schema: 'silver_dev'
  gold_schema: 'gold_dev'

models:
  +on_schema_change: append_new_columns
  +persist_docs: { relation: true, columns: true }

  look_dbt:
    staging:
      # Provide defaults so debug won't fail even if vars aren't loaded
      +schema: '{{ var("silver_schema", "silver_dev") }}'
      +materialized: view
      look:
        +schema: '{{ var("silver_schema", "silver_dev") }}'

    intermediate:
      +materialized: ephemeral
      commerce:
        +schema: '{{ var("silver_schema", "silver_dev") }}'

    marts:
      +schema: '{{ var("gold_schema", "gold_dev") }}'
      +materialized: table
      core:
        +schema: '{{ var("gold_schema", "gold_dev") }}'

on-run-end:
  - "{{ notify_slack_on_failure() }}"

name: 'look_dbt'
version: '1.1.0'
config-version: 2
profile: 'look_dbt'

model-paths: ['models']
macro-paths: ['macros']
seed-paths: ['seeds']
analysis-paths: ['analyses']
snapshot-paths: ['snapshots']
test-paths: ['tests']

quoting:
  database: false
  schema: false
  identifier: false

flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  use_materialization_v2: true

# ---------- Vars (NO Jinja here) ----------
vars:
  catalog_name: 'sujeet_data_analytics_workspace'
  # Elementary defaults (dev). Override via --vars for prod.
  elementary:
    account_name: 'sujeet_data_analytics_workspace'
    edr_database: 'sujeet_data_analytics_workspace'
    edr_schema: 'edr'
    send_anonymous_usage_stats: false
    default_monitors:
      freshness:          { time_bucket: day, max_lag: "26 hours" }
      volume_anomalies:   { sensitivity: medium }
      schema_changes:     { enabled: true, fail_on_drop: false }
      tests_failures:     {}
      null_percent_anomalies: { sensitivity: medium }

# ---------- Snapshots (Jinja allowed in config) ----------
snapshots:
  +database: 'sujeet_data_analytics_workspace'
  +schema: "{{ 'snapshots_prod' if target.name == 'prod' else 'snapshots_dev' }}"
  +persist_docs: { relation: true, columns: true }
  +tags: ['snapshots']

# ---------- Models ----------
models:
  +persist_docs: { relation: true, columns: true }

  elementary:
    +database: 'sujeet_data_analytics_workspace'
    +schema:   "{{ 'edr_prod' if target.name == 'prod' else 'edr' }}"

  look_dbt:
    staging:
      +schema: "{{ 'silver_prod' if target.name == 'prod' else 'silver_dev' }}"
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns

    intermediate:
      +schema: "{{ 'silver_prod' if target.name == 'prod' else 'silver_dev' }}"
      +materialized: table

    marts:
      +schema: "{{ 'gold_prod' if target.name == 'prod' else 'gold_dev' }}"
      +materialized: table

version: 2

models:
  - name: stg_look__orders
    description: Clean, typed, deduplicated orders (no joins). Grain: 1 row per order_id.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - relationships: {to: ref('stg_look__users'), field: user_id}

  - name: stg_look__order_items
    description: Clean order_items with normalized statuses, money, and dates. Grain: 1 row per order_item_id.
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships: {to: ref('stg_look__orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('stg_look__products'), field: product_id}

  - name: stg_look__products
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: stg_look__inventory_items
    columns:
      - name: inventory_item_id
        tests: [not_null, unique]

  - name: stg_look__distribution_centers
    columns:
      - name: distribution_center_id
        tests: [not_null, unique]

  - name: stg_look__users
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: email_sha256
        tests: [not_null]
